<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-hidden="true">
  <!-- Background -->
  <rect width="800" height="270" fill="white"/>

  <!-- === SHOES (top-left) === -->
  <!-- Shoe 1 (points right) -->
  <g transform="translate(20,30)">
    <ellipse cx="55" cy="68" rx="58" ry="11" fill="#5a3a1a"/>
    <path d="M8,62 Q0,28 28,18 Q46,9 74,16 Q104,23 108,48 Q112,62 108,62 Z" fill="#a0652a"/>
    <path d="M28,18 Q46,9 74,16 L70,32 Q52,25 32,32 Z" fill="#c8843a"/>
    <ellipse cx="103" cy="52" rx="9" ry="13" fill="#8a5522"/>
  </g>
  <!-- Shoe 2 (mirrored, points left) -->
  <g transform="translate(120,30) scale(-1,1) translate(-116,0)">
    <ellipse cx="55" cy="68" rx="58" ry="11" fill="#5a3a1a"/>
    <path d="M8,62 Q0,28 28,18 Q46,9 74,16 Q104,23 108,48 Q112,62 108,62 Z" fill="#a0652a"/>
    <path d="M28,18 Q46,9 74,16 L70,32 Q52,25 32,32 Z" fill="#c8843a"/>
    <ellipse cx="103" cy="52" rx="9" ry="13" fill="#8a5522"/>
  </g>

  <!-- === RED LADYBIRD (3) — center-left === -->
  <g transform="translate(170,0)">
    <ellipse cx="115" cy="160" rx="98" ry="90" fill="#c0392b" stroke="#7b241c" stroke-width="3"/>
    <line x1="115" y1="70" x2="115" y2="250" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="76" cy="128" r="17" fill="#1a1a1a"/>
    <circle cx="154" cy="128" r="17" fill="#1a1a1a"/>
    <circle cx="73" cy="172" r="15" fill="#1a1a1a"/>
    <circle cx="157" cy="172" r="15" fill="#1a1a1a"/>
    <ellipse cx="115" cy="72" rx="42" ry="30" fill="#1a1a1a"/>
    <line x1="96" y1="48" x2="75" y2="18" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="75" cy="18" r="7" fill="#1a1a1a"/>
    <line x1="134" y1="48" x2="155" y2="18" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="155" cy="18" r="7" fill="#1a1a1a"/>
    <text x="115" y="225" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="bold" fill="white">3</text>
  </g>

  <!-- === BLUE LADYBIRD (8) — center-right === -->
  <g transform="translate(400,0)">
    <ellipse cx="115" cy="160" rx="98" ry="90" fill="#2471a3" stroke="#1a5276" stroke-width="3"/>
    <line x1="115" y1="70" x2="115" y2="250" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="76" cy="118" r="15" fill="#1a1a1a"/>
    <circle cx="154" cy="118" r="15" fill="#1a1a1a"/>
    <circle cx="72" cy="155" r="14" fill="#1a1a1a"/>
    <circle cx="158" cy="155" r="14" fill="#1a1a1a"/>
    <circle cx="75" cy="192" r="14" fill="#1a1a1a"/>
    <circle cx="155" cy="192" r="14" fill="#1a1a1a"/>
    <ellipse cx="115" cy="72" rx="42" ry="30" fill="#1a1a1a"/>
    <line x1="96" y1="48" x2="75" y2="18" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="75" cy="18" r="7" fill="#1a1a1a"/>
    <line x1="134" y1="48" x2="155" y2="18" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="155" cy="18" r="7" fill="#1a1a1a"/>
    <text x="115" y="225" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="bold" fill="white">8</text>
  </g>

  <!-- === HOUSES (top-right) — 3 in a row === -->
  <!-- House 1 (red, odd) -->
  <g transform="translate(596,5)">
    <polygon points="32,0 0,38 64,38" fill="#8b1a1a" stroke="#5a0a0a" stroke-width="2"/>
    <rect x="4" y="36" width="56" height="52" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect x="21" y="60" width="14" height="28" fill="#5a0a0a" rx="2"/>
    <rect x="6" y="42" width="14" height="13" fill="#87ceeb" stroke="#5a0a0a" stroke-width="1"/>
    <rect x="44" y="42" width="14" height="13" fill="#87ceeb" stroke="#5a0a0a" stroke-width="1"/>
    <text x="32" y="101" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">1</text>
  </g>
  <!-- House 2 (blue, even) -->
  <g transform="translate(664,5)">
    <polygon points="32,0 0,38 64,38" fill="#1a3a7a" stroke="#0a1a4a" stroke-width="2"/>
    <rect x="4" y="36" width="56" height="52" fill="#2980b9" stroke="#1a5276" stroke-width="2"/>
    <rect x="21" y="60" width="14" height="28" fill="#0a1a4a" rx="2"/>
    <rect x="6" y="42" width="14" height="13" fill="#87ceeb" stroke="#0a1a4a" stroke-width="1"/>
    <rect x="44" y="42" width="14" height="13" fill="#87ceeb" stroke="#0a1a4a" stroke-width="1"/>
    <text x="32" y="101" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">2</text>
  </g>
  <!-- House 3 (red, odd) -->
  <g transform="translate(732,5)">
    <polygon points="32,0 0,38 64,38" fill="#8b1a1a" stroke="#5a0a0a" stroke-width="2"/>
    <rect x="4" y="36" width="56" height="52" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
    <rect x="21" y="60" width="14" height="28" fill="#5a0a0a" rx="2"/>
    <rect x="6" y="42" width="14" height="13" fill="#87ceeb" stroke="#5a0a0a" stroke-width="1"/>
    <rect x="44" y="42" width="14" height="13" fill="#87ceeb" stroke="#5a0a0a" stroke-width="1"/>
    <text x="32" y="101" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="white">3</text>
  </g>

  <!-- === NUMBER GRID (bottom-left) — 2 rows x 3 columns === -->
  <g transform="translate(16,152)">
    <!-- Row 1: red/odd -->
    <rect x="0"  y="0" width="42" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="3"/>
    <text x="21" y="27" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">1</text>
    <rect x="46" y="0" width="42" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="3"/>
    <text x="67" y="27" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">2</text>
    <rect x="92" y="0" width="42" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="2" rx="3"/>
    <text x="113" y="27" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">3</text>
    <!-- Row 2: blue/even -->
    <rect x="0"  y="44" width="42" height="40" fill="#2980b9" stroke="#1a5276" stroke-width="2" rx="3"/>
    <text x="21" y="71" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="white">11</text>
    <rect x="46" y="44" width="42" height="40" fill="#2980b9" stroke="#1a5276" stroke-width="2" rx="3"/>
    <text x="67" y="71" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="white">12</text>
    <rect x="92" y="44" width="42" height="40" fill="#2980b9" stroke="#1a5276" stroke-width="2" rx="3"/>
    <text x="113" y="71" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="white">13</text>
  </g>

  <!-- === COCONUTS (bottom-right) — 3 on sticks === -->
  <!-- Coconut 1 (8) -->
  <g transform="translate(630,128)">
    <rect x="18" y="0" width="5" height="52" fill="#7c5c3a" rx="2"/>
    <ellipse cx="20" cy="82" rx="28" ry="36" fill="#6b4226" stroke="#4a2c12" stroke-width="2"/>
    <ellipse cx="12" cy="65" rx="9" ry="12" fill="#8b6040" opacity="0.5"/>
    <text x="20" y="88" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">8</text>
  </g>
  <!-- Coconut 2 (10) — taller stick -->
  <g transform="translate(700,110)">
    <rect x="18" y="0" width="5" height="64" fill="#7c5c3a" rx="2"/>
    <ellipse cx="20" cy="96" rx="28" ry="36" fill="#6b4226" stroke="#4a2c12" stroke-width="2"/>
    <ellipse cx="12" cy="79" rx="9" ry="12" fill="#8b6040" opacity="0.5"/>
    <text x="20" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="white">10</text>
  </g>
  <!-- Coconut 3 (7) -->
  <g transform="translate(748,132)">
    <rect x="18" y="0" width="5" height="44" fill="#7c5c3a" rx="2"/>
    <ellipse cx="20" cy="76" rx="28" ry="36" fill="#6b4226" stroke="#4a2c12" stroke-width="2"/>
    <ellipse cx="12" cy="59" rx="9" ry="12" fill="#8b6040" opacity="0.5"/>
    <text x="20" y="82" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="white">7</text>
  </g>
