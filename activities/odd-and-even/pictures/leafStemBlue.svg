<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="100" viewBox="0 0 40 100" role="img" aria-label="Blue leaf stem">
  <title>Blue leaf stem</title>
  <!-- Curved stem matching Flash: dark blue gradient, gentle bend from
       upper-right (under leaf base) down-left toward centre. Mirror of
       red stem to flank the central done button symmetrically. -->
  <defs>
    <linearGradient id="stemBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b2a8a"/>
      <stop offset="50%" stop-color="#2e44c6"/>
      <stop offset="100%" stop-color="#11185c"/>
    </linearGradient>
  </defs>
  <path d="M18 0 Q22 30 14 60 Q10 80 6 100 L0 100 L0 100 Q4 80 8 60 Q18 30 18 0 Z"
        transform="translate(40 0) scale(-1 1)"
        fill="url(#stemBlueGrad)" stroke="#171860" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
