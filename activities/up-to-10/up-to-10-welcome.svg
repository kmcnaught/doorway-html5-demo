<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180">
  <!-- Up to 10 welcome illustration: scattered objects with number labels,
       representing the counting activity. Decorative only. -->

  <!-- Apple 1 -->
  <g transform="translate(30,30)">
    <circle cx="20" cy="28" r="16" fill="#cc3333"/>
    <ellipse cx="20" cy="12" rx="4" ry="7" fill="#339900" transform="rotate(-15,20,12)"/>
    <ellipse cx="13" cy="22" rx="4" ry="3" fill="#ee6666" opacity="0.5"/>
    <text x="20" y="33" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial,sans-serif">1</text>
  </g>

  <!-- Apple 2 -->
  <g transform="translate(80,15)">
    <circle cx="20" cy="28" r="16" fill="#cc3333"/>
    <ellipse cx="20" cy="12" rx="4" ry="7" fill="#339900" transform="rotate(10,20,12)"/>
    <ellipse cx="13" cy="22" rx="4" ry="3" fill="#ee6666" opacity="0.5"/>
    <text x="20" y="33" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial,sans-serif">2</text>
  </g>

  <!-- Apple 3 -->
  <g transform="translate(55,70)">
    <circle cx="20" cy="28" r="16" fill="#cc3333"/>
    <ellipse cx="20" cy="12" rx="4" ry="7" fill="#339900" transform="rotate(-5,20,12)"/>
    <ellipse cx="13" cy="22" rx="4" ry="3" fill="#ee6666" opacity="0.5"/>
    <text x="20" y="33" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial,sans-serif">3</text>
  </g>

  <!-- Star 4 -->
  <g transform="translate(150,10)">
    <polygon points="22,2 26,14 38,14 28,22 32,34 22,26 12,34 16,22 6,14 18,14" fill="#ffcc00" stroke="#cc9900" stroke-width="1"/>
    <text x="22" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#663300" font-family="Arial,sans-serif">4</text>
  </g>

  <!-- Star 5 -->
  <g transform="translate(200,25)">
    <polygon points="22,2 26,14 38,14 28,22 32,34 22,26 12,34 16,22 6,14 18,14" fill="#ffcc00" stroke="#cc9900" stroke-width="1"/>
    <text x="22" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#663300" font-family="Arial,sans-serif">5</text>
  </g>

  <!-- Star 6 -->
  <g transform="translate(175,75)">
    <polygon points="22,2 26,14 38,14 28,22 32,34 22,26 12,34 16,22 6,14 18,14" fill="#ffcc00" stroke="#cc9900" stroke-width="1"/>
    <text x="22" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#663300" font-family="Arial,sans-serif">6</text>
  </g>

  <!-- Hat 7 -->
  <g transform="translate(265,15)">
    <rect x="4" y="18" width="36" height="6" rx="2" fill="#4466aa" stroke="#223366" stroke-width="1"/>
    <rect x="10" y="4" width="24" height="16" rx="3" fill="#4466aa" stroke="#223366" stroke-width="1"/>
    <text x="22" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#223366" font-family="Arial,sans-serif">7</text>
  </g>

  <!-- Hat 8 -->
  <g transform="translate(310,30)">
    <rect x="4" y="18" width="36" height="6" rx="2" fill="#4466aa" stroke="#223366" stroke-width="1"/>
    <rect x="10" y="4" width="24" height="16" rx="3" fill="#4466aa" stroke="#223366" stroke-width="1"/>
    <text x="22" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#223366" font-family="Arial,sans-serif">8</text>
  </g>

  <!-- Orange 9 -->
  <g transform="translate(285,80)">
    <circle cx="20" cy="24" r="18" fill="#e87020"/>
    <ellipse cx="14" cy="16" rx="5" ry="3" fill="#f0a040" opacity="0.5"/>
    <ellipse cx="20" cy="8" rx="3" ry="6" fill="#339900" transform="rotate(-10,20,8)"/>
    <text x="20" y="29" text-anchor="middle" font-size="11" font-weight="bold" fill="white" font-family="Arial,sans-serif">9</text>
  </g>

  <!-- Kite 10 -->
  <g transform="translate(350,10)">
    <polygon points="18,2 34,20 18,38 2,20" fill="#cc44cc" stroke="#883388" stroke-width="1.5"/>
    <line x1="18" y1="2" x2="18" y2="38" stroke="#883388" stroke-width="0.8"/>
    <line x1="2" y1="20" x2="34" y2="20" stroke="#883388" stroke-width="0.8"/>
    <path d="M18,38 Q22,50 18,60" fill="none" stroke="#883388" stroke-width="1"/>
    <text x="18" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="white" font-family="Arial,sans-serif">10</text>
  </g>

  <!-- Number line hint at bottom -->
  <g transform="translate(10,130)">
    <rect x="0" y="0" width="380" height="40" rx="4" fill="#dde4ff" stroke="#103c67" stroke-width="1.5"/>
    <text x="190" y="17" text-anchor="middle" font-size="10" fill="#103c67" font-family="Arial,sans-serif">How many are there?</text>
    <g>
      <!-- 10 small number slots -->
      <rect x="4"   y="22" width="34" height="14" rx="2" fill="white" stroke="#103c67" stroke-width="1"/>
      <rect x="42"  y="22" width="34" height="14" rx="2" fill="white" stroke="#103c67" stroke-width="1"/>
      <rect x="80"  y="22" width="34" height="14" rx="2" fill="white" stroke="#103c67" stroke-width="1"/>
      <rect x="118" y="22" width="34" height="14" rx="2" fill="white" stroke="#103c67" stroke-width="1"/>
      <rect x="156" y="22" width="34" height="14" rx="2" fill="#86e25f" stroke="#00aa1a" stroke-width="1"/>
      <rect x="194" y="22" width="34" height="14" rx="2" fill="white" stroke="#103c67" stroke-width="1"/>
      <rect x="232" y="22" width="34" height="14" rx="2" fill="white" stroke="#103c67" stroke-width="1"/>
      <rect x="270" y="22" width="34" height="14" rx="2" fill="white" stroke="#103c67" stroke-width="1"/>
      <rect x="308" y="22" width="34" height="14" rx="2" fill="white" stroke="#103c67" stroke-width="1"/>
      <rect x="346" y="22" width="30" height="14" rx="2" fill="white" stroke="#103c67" stroke-width="1"/>
      <text x="21"  y="33" text-anchor="middle" font-size="9" fill="#103c67" font-family="Arial,sans-serif">1</text>
      <text x="59"  y="33" text-anchor="middle" font-size="9" fill="#103c67" font-family="Arial,sans-serif">2</text>
      <text x="97"  y="33" text-anchor="middle" font-size="9" fill="#103c67" font-family="Arial,sans-serif">3</text>
      <text x="135" y="33" text-anchor="middle" font-size="9" fill="#103c67" font-family="Arial,sans-serif">4</text>
      <text x="173" y="33" text-anchor="middle" font-size="9" fill="#005500" font-weight="bold" font-family="Arial,sans-serif">5</text>
      <text x="211" y="33" text-anchor="middle" font-size="9" fill="#103c67" font-family="Arial,sans-serif">6</text>
      <text x="249" y="33" text-anchor="middle" font-size="9" fill="#103c67" font-family="Arial,sans-serif">7</text>
      <text x="287" y="33" text-anchor="middle" font-size="9" fill="#103c67" font-family="Arial,sans-serif">8</text>
      <text x="325" y="33" text-anchor="middle" font-size="9" fill="#103c67" font-family="Arial,sans-serif">9</text>
      <text x="361" y="33" text-anchor="middle" font-size="9" fill="#103c67" font-family="Arial,sans-serif">10</text>
    </g>
  </g>
</svg>
