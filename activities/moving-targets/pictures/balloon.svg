<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Balloon graphic ported from Flash sprite_293 (Moving Targets / Popping Outside).
  The fill colour is parameterised via the `currentColor` keyword so the
  balloon can be tinted with CSS `color: var(--mt-balloon-colour)`.
  The white highlight (radial gradient) and dark outline come from the
  original Flash shapes 290/291/292.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-58 -71 117 194"
     preserveAspectRatio="xMidYMax meet">
  <defs>
    <radialGradient id="balloonHighlight" cx="0" cy="0" r="55"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="matrix(0.55, 0, 0, 0.7, -13, -36)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Balloon body fill (uses currentColor so CSS can recolour) -->
  <path d="M40.5 -50.75 Q56.7 -34.55 56.7 -11.6 Q56.7 -0.45 52.2 11.4
           Q47.9 22.6 40.5 32.1 Q30.0 47.65 23.4 55.8 Q11.3 70.65 1.8 70.75
           L1.4 70.75 Q-8.25 70.75 -20.45 55.95 Q-24.3 51.25 -29.95 43.2
           L-37.8 32.1 Q-54.0 11.05 -54.0 -11.6 Q-54.0 -34.55 -37.8 -50.75
           Q-21.55 -66.95 1.4 -66.95 Q24.3 -66.95 40.5 -50.75 Z"
        fill="currentColor"/>

  <!-- Specular highlight -->
  <path d="M40.5 -50.75 Q56.7 -34.55 56.7 -11.6 Q56.7 -0.45 52.2 11.4
           Q47.9 22.6 40.5 32.1 Q30.0 47.65 23.4 55.8 Q11.3 70.65 1.8 70.75
           L1.4 70.75 Q-8.25 70.75 -20.45 55.95 Q-24.3 51.25 -29.95 43.2
           L-37.8 32.1 Q-54.0 11.05 -54.0 -11.6 Q-54.0 -34.55 -37.8 -50.75
           Q-21.55 -66.95 1.4 -66.95 Q24.3 -66.95 40.5 -50.75 Z"
        fill="url(#balloonHighlight)"/>

  <!-- Outline + tied string -->
  <path d="M1.85 119.2 Q4.9 112.0 4.6 106.95 Q4.35 101.95 2.95 97.15
           Q1.6 92.4 1.05 87.95 Q0.45 83.5 1.85 71.0
           L1.45 71.0 Q-8.2 71.0 -20.4 56.2 Q-24.25 51.5 -29.9 43.45
           Q-36.1 34.45 -37.75 32.35 Q-53.95 11.3 -53.95 -11.35
           Q-53.95 -34.3 -37.75 -50.5 Q-21.5 -66.7 1.45 -66.7
           Q24.35 -66.7 40.55 -50.5 Q56.75 -34.3 56.75 -11.35
           Q56.75 -0.2 52.25 11.65 Q47.95 22.85 40.55 32.35
           Q30.05 47.9 23.45 56.05 Q11.35 70.9 1.85 71.0"
        fill="none" stroke="#000000" stroke-opacity="0.4"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
